# Copy to config.yaml and update connection details.
# Then run: python -m oracle_mssql_migrate

oracle:
  user: oracle_user
  password: oracle_password
  dsn: localhost:1521/ORCLPDB1
  schema: BLADELOGIC

sqlserver:
  host: localhost
  port: 1433
  database: TSSA
  user: sa
  password: sqlserver_password
  schema: dbo
  driver: "ODBC Driver 17 for SQL Server"
  trust_server_certificate: true

migrate:
  tables: []
  exclude_tables: []   # also skips IDENTITY sync for these tables
  lowercase_columns: false   # keep SQL Server catalog names as-is
  column_mapping_file: ./column_mapping.yaml

  truncate_before_import: true
  truncate_all_before_migration: true
  disable_foreign_keys: true
  disable_triggers: true
  restart_identity: true
  sync_identities_after_migration: true
  validate_after_migration: false

export:
  output_dir: ./export_data
  fetch_size: 10000
  quote_nonnumeric: true

import:
  batch_size: 5000

logging:
  log_dir: ./logs
